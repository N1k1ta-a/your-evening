<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Твой вечер ❤️</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #fdf6f0 0%, #f3e8ff 100%);
    min-height: 100vh;
    padding: 24px 18px 40px;
    color: #4a3f55;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 600; margin-bottom: 6px; }
  .sub { font-size: 15px; color: #8a7d99; margin-bottom: 24px; line-height: 1.4; }

  .card {
    display: flex; align-items: center; gap: 14px;
    background: #fff;
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 12px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all .25s ease;
    box-shadow: 0 2px 8px rgba(120, 90, 150, .06);
    user-select: none;
  }
  .card:active { transform: scale(.98); }
  .card .icon { font-size: 26px; line-height: 1; flex-shrink: 0; }
  .card .label { font-size: 15px; flex: 1; line-height: 1.35; }
  .card .check {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid #d9cfe6;
    display: flex; align-items: center; justify-content: center;
    transition: all .25s ease;
    flex-shrink: 0;
  }
  .card .check svg { opacity: 0; transform: scale(.5); transition: all .25s ease; }
  .card.on {
    background: #f6eeff;
    border-color: #c9a9f0;
    box-shadow: 0 4px 16px rgba(160, 120, 220, .18);
  }
  .card.on .check { background: #a97bea; border-color: #a97bea; }
  .card.on .check svg { opacity: 1; transform: scale(1); }

  .counter {
    text-align: center; font-size: 14px; color: #8a7d99;
    margin: 20px 0 16px; min-height: 20px;
  }

  .send {
    width: 100%; border: none; border-radius: 18px;
    padding: 18px; font-size: 17px; font-weight: 600;
    color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #b98be8 0%, #8f6bd6 100%);
    box-shadow: 0 6px 20px rgba(150, 110, 210, .35);
    transition: all .25s ease;
    font-family: inherit;
  }
  .send:active { transform: scale(.97); }
  .send:disabled {
    background: #e2d9ee; color: #a99dbb; box-shadow: none; cursor: default;
  }
  .hint { text-align: center; font-size: 13px; color: #a99dbb; margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Привет, любимая ❤️</h1>
  <p class="sub">Ты сегодня много сделала. Выбери, что поможет тебе расслабиться — и покажи мне, как пройдёт твой вечер.</p>

  <div id="list"></div>

  <div class="counter" id="counter"></div>

  <button class="send" id="sendBtn" disabled onclick="sendChoice()">Показать мой вечер ❤️</button>
  <p class="hint" id="hint">Откроется Telegram — выбери меня в списке чатов, текст уже будет готов ❤️</p>
</div>

<script>
  const ITEMS = [
    { id: 'gamehub',  icon: '🎮', label: 'Проводим вечер в игровой сфере' },
    { id: 'genshin',  icon: '🏃', label: 'Побегаем, отдохнём в Геншине' },
    { id: 'vvm',      icon: '🖥️', label: 'Пойдём, освоим ВВМ вместе' },
    { id: 'role',     icon: '🎭', label: 'Поучим меня играть на любой роли, которую скажешь ты' },
    { id: 'watch',    icon: '📺', label: 'Посмотрим вместе сериал / фильм / аниме / мультик' },
    { id: 'bath',     icon: '🛁', label: 'Отдохнёшь, повалявшись первым делом в тёплой ванночке' },
    { id: 'hugs',     icon: '🤗', label: 'Обнимашки со мной' },
    { id: 'podcast',  icon: '🎧', label: 'Посмотрим, какой подкаст / обзор / гайдик' },
    { id: 'sleep',    icon: '😴', label: 'И напоследок ляжем вместе спатюшки в звоночке' }
  ];

  // ←←← ЗАМЕНИ НА СВОЙ НОМЕР В МЕЖДУНАРОДНОМ ФОРМАТЕ (с +) →→→
  const MY_PHONE = '+79619482168';

  const KEY = 'eveningChoice';
  let selected = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));

  const listEl = document.getElementById('list');
  const counterEl = document.getElementById('counter');
  const sendBtn = document.getElementById('sendBtn');

  const checkSVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function render() {
    listEl.innerHTML = '';
    ITEMS.forEach(item => {
      const on = selected.has(item.id);
      const card = document.createElement('div');
      card.className = 'card' + (on ? ' on' : '');
      card.innerHTML = `
        <span class="icon">${item.icon}</span>
        <span class="label">${item.label}</span>
        <span class="check">${checkSVG}</span>
      `;
      card.onclick = () => {
        if (selected.has(item.id)) selected.delete(item.id);
        else selected.add(item.id);
        localStorage.setItem(KEY, JSON.stringify([...selected]));
        render();
      };
      listEl.appendChild(card);
    });
    updateCounter();
  }

  function updateCounter() {
    const n = selected.size;
    if (n === 0) {
      counterEl.textContent = '';
      sendBtn.disabled = true;
    } else {
      counterEl.textContent = n === 1 ? 'Выбран 1 пункт' : `Выбрано пунктов: ${n}`;
      sendBtn.disabled = false;
    }
  }

  function sendChoice() {
    const chosen = ITEMS.filter(i => selected.has(i.id));
    const lines = chosen.map(i => i.icon + ' ' + i.label).join('\n');
    const text = 'Мой вечер:\n' + lines;
    const encoded = encodeURIComponent(text);

    // Копируем в буфер — запасной вариант, если Telegram не подставит сам
    navigator.clipboard.writeText(text).catch(() => {});

    // Открываем Telegram с выбором чата и подготовленным текстом.
    // Она сама выберет тебя из списка — это надёжный способ для обычных аккаунтов.
    const tgLink = `https://t.me/share/url?url=&text=${encoded}`;
    window.open(tgLink, '_blank');

    sendBtn.textContent = 'Открываю Telegram ❤️';
    setTimeout(() => { sendBtn.textContent = 'Показать мой вечер ❤️'; }, 3000);
  }

  render();
</script>
</body>
</html>
